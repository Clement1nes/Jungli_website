<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Jungli - Handcrafted Sterling Silver & Gold Plated Rings</title>
    <meta name="description" content="Discover unique handcrafted rings including the Third Eye Ring, Shooting Star Ring, and Footprint Ring. Available in Sterling Silver and 18k Gold Plated with gemstone options." />
    <meta name="keywords" content="handcrafted rings, sterling silver rings, gold plated rings, third eye ring, gemstone rings, artisan jewelry" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jungli.com/" />
    <meta property="og:title" content="Jungli - Handcrafted Sterling Silver & Gold Plated Rings" />
    <meta property="og:description" content="Discover unique handcrafted rings including the Third Eye Ring, Shooting Star Ring, and Footprint Ring." />
    <meta property="og:image" content="/assets/newlogo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.jungli.com/" />
    <meta property="twitter:title" content="Jungli - Handcrafted Sterling Silver & Gold Plated Rings" />
    <meta property="twitter:description" content="Discover unique handcrafted rings including the Third Eye Ring, Shooting Star Ring, and Footprint Ring." />
    <meta property="twitter:image" content="/assets/newlogo.png" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden SVG Filters for rugged stone button effect -->
    <svg style="visibility: hidden; position: absolute;" width="0" height="0" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Heavy jagged edges for the silhouette -->
        <filter id="rock-jagged" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="5" seed="5" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Subtle surface grain for internal texture -->
        <filter id="stone-surface" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="grain" />
          <feDiffuseLighting in="grain" lighting-color="#ffffff" surfaceScale="2">
            <feDistantLight azimuth="45" elevation="60" />
          </feDiffuseLighting>
          <feComposite in2="SourceGraphic" operator="in" />
        </filter>

        <!-- Chipped stone filter for highlights -->
        <filter id="chipped">
          <feTurbulence type="turbulence" baseFrequency="0.05" numOctaves="2" seed="2" result="turb" />
          <feDisplacementMap in="SourceGraphic" in2="turb" scale="3" />
        </filter>
      </defs>
    </svg>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
